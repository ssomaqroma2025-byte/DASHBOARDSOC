name: Reconstruir dashboard SOC
# Repositorio público con los datos CIFRADOS (data/**/*.enc). Las claves están en Secrets:
#   SOC_DATA_KEY (datos) y CLAVE_WEB (clave del dashboard). La web se publica en GitHub Pages.
on:
  push:
    paths:
      - "data/**"
      - "app/**"
      - ".github/workflows/build.yml"
  repository_dispatch:
    types: [nuevo-soc, carga-soc, sync-personal, sync-justif, sync-bajas]
  schedule:
    - cron: "0 * * * *"    # cada hora en punto: la web se arma por reloj, no con cada SOC que entra
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  # 1) Guardar el dato que mandó Power Automate (cada SOC se guarda siempre, nunca se pierde)
  guardar:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10      # si GitHub se traba, se corta solo y no bloquea a los demás
    env:
      SOC_DATA_KEY: ${{ secrets.SOC_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Guardar lo que mandó Power Automate
        run: |
          pip install --quiet cryptography
          git config user.name "robot-soc"
          git config user.email "robot@users.noreply.github.com"
          python app/cifra.py abrir
          python app/recibir.py
          python app/cifra.py cerrar
          git add data
          git commit -q -m "Datos: ${{ github.event.action }} [robot]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git push -q && exit 0
            sleep $((RANDOM % 8 + 2)); git pull -q --rebase
          done
          exit 1

  # 2) Armar la web con TODO lo guardado, protegerla con la clave y publicarla en GitHub Pages.
  #    NO se publica con cada repository_dispatch: los SOC entran más rápido de lo que tarda la
  #    publicación y se cancelaban entre ellas (el sitio llegó a quedarse 2 h sin actualizar).
  #    Ahora la web se arma por horario (cada hora) y a mano con "Run workflow". El dato igual se
  #    guarda siempre, porque el job "guardar" sí corre con cada disparo.
  publicar:
    needs: guardar
    if: always() && (needs.guardar.result == 'success' || needs.guardar.result == 'skipped') && github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10      # si una publicación se traba, se corta y deja pasar a la siguiente
    concurrency:
      group: publicar-2        # grupo nuevo: la run #2110 quedó atascada en cola en el grupo "publicar" y lo bloqueaba
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      SOC_DATA_KEY: ${{ secrets.SOC_DATA_KEY }}
      CLAVE_WEB: ${{ secrets.CLAVE_WEB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Armar la web
        run: |
          pip install --quiet cryptography
          python app/cifra.py abrir
          python app/build.py
          python app/cifra.py web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar en GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
